name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-orchestra:
    name: codex mirror - ${{ matrix.os }} - node ${{ matrix.node }}${{ matrix.advisory && ' - advisory' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: ['20', '22', '24']
        advisory: [false]
        include:
          - os: ubuntu-latest
            node: '22'
            advisory: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Configure fixture Git identity
        shell: bash
        run: |
          git config --global user.email "orchestra-ci@users.noreply.github.com"
          git config --global user.name "Orchestra CI"
          git config --global init.defaultBranch main

      - name: Validate source profiles and manifests
        run: node install.js --lint

      - name: Provider inversion contract
        run: node tests/provider-contract.test.js

      - name: Installer suite
        run: node tests/install.test.js

      - name: Coexistence contract
        run: node tests/coexistence.test.js

      - name: Director guard suite
        run: node tests/guard.test.js

      - name: Claude review lane suite
        run: node tests/review-lane.test.js

      - name: Claude review transport suite
        run: node tests/review-transport.test.js
